<div class="expense-category-summary">
    <style>
        .expense-category-summary {{ margin: 0.25rem 0 0.8rem; font-family: "Trebuchet MS", Georgia, serif; }}
        .expense-summary-heading {{ margin: 0.7rem 0 0.4rem; color: #4e2922; font-size: 1.05rem; font-weight: 900; }}
        .expense-stats-grid {{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.4rem; margin: 0.25rem 0 0.55rem; }}
        .expense-stat-card {{ position: relative; min-height: 3.45rem; padding: 0.55rem 0.7rem 0.5rem; overflow: hidden; border: 1px solid #eadcc6; border-left: 4px solid #c8691d; border-radius: 10px; background: linear-gradient(135deg, #fffdf8 0%, #f7eee3 100%); box-shadow: 0 4px 10px rgba(105, 76, 52, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.8); }}
        .expense-stat-card:nth-child(1) {{ border-left-color: #6a1b1b; background: linear-gradient(135deg, #fff8e8 0%, #f5e1d0 100%); }}
        .expense-stat-card:nth-child(2) {{ border-left-color: #ef6c00; }}
        .expense-stat-card:nth-child(3) {{ border-left-color: #2e7d32; }}
        .expense-stat-card:nth-child(4) {{ border-left-color: #1565c0; }}
        .expense-stat-card:nth-child(5) {{ border-left-color: #7e57c2; }}
        .expense-stat-card:nth-child(6) {{ border-left-color: #00838f; }}
        .expense-stat-card::after {{ position: absolute; right: -0.25rem; bottom: -0.65rem; color: rgba(166, 75, 18, 0.1); content: "✦"; font-size: 2.8rem; line-height: 1; }}
        .expense-stat-label {{ display: block; color: #6d625b; font-size: 0.68rem; font-weight: 800; line-height: 1.2; }}
        .expense-stat-count {{ display: block; margin-top: 0.12rem; color: #6a1b1b; font-size: 1.25rem; font-weight: 900; line-height: 1; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7); }}
        .expense-stat-unit {{ display: inline-block; margin-left: 0.25rem; color: #8b6f61; font-size: 0.63rem; font-weight: 700; }}
        @media (max-width: 560px) {{ .expense-stats-grid {{ grid-template-columns: repeat(2, minmax(0, 1fr)); }} }}
    </style>
    <div class="expense-summary-heading">📊 Category Expense Summary</div>
    <div class="expense-stats-grid">{table_rows}</div>
</div>
